{% extends "base.html" %}

{% block title %}Chuva de Contas - Divermatica{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/jogo-multiplicacao.css') }}">

<div class="container" id="container">

    <h1>Chuva de Contas</h1>

    <div class="hud">
        <span>Pontos: <b id="pontos">0</b></span>

        <span>Vidas: <b id="vidas">5</b></span>

        <button onclick="sairJogo()" class="btn-sair">
            ⬅ Sair
        </button>
    </div>

    <div id="jogo"></div>

    <div class="input-area">

        <input
            type="number"
            id="resposta"
            placeholder="Digite a resposta"
            autocomplete="off"
        >

        <button onclick="verificar()">
            Responder
        </button>

    </div>

</div>


<!-- GAME OVER -->

<div id="game-over">

    <div class="game-over-box">

        <h2>Game Over!</h2>

        <p>
            Sua pontuação:
            <b id="pontuacao-final">0</b>
        </p>

        <button onclick="reiniciarJogo()">
            Jogar novamente
        </button>

        <button onclick="window.location.href='/jogos'">
            Voltar para página de jogos
        </button>

    </div>

</div>


<div class="voltar-container">

    <a
        href="{{ url_for('jogos_index') }}"
        class="back-link"
    >
        ← Voltar
    </a>

</div>


<script src="{{ url_for('static', filename='js/dificuldade-por-ano.js') }}"></script>
<script src="{{ url_for('static', filename='js/jogo-multiplicacao.js') }}"></script>

{% endblock %}
